---
layout: default
---

<article class="post">
    <header style="margin-bottom: 2rem;" class="post-header">
        <h1>{{ page.title }}</h1>
        <div class="date">{{ page.date | date: "%Y-%m-%d" }}</div>
    </header>

    <div class="post-content">
        {{ content }}
    </div>
</article>
